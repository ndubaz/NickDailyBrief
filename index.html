<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nick's Daily Readbook</title>
<meta name="description" content="Personal daily reading: security, profession, money, home, hockey.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F3F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F141A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="preload" href="fonts/barlowcondensed-normal-700.woff2" as="font" type="font/woff2" crossorigin>
